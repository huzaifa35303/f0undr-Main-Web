<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="cyanAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088aa" />
    </linearGradient>
  </defs>
  
  <!-- Sleek obsidian dark background badge -->
  <rect width="128" height="128" rx="30" fill="#08090d" />
  <circle cx="64" cy="64" r="56" fill="url(#cyanAmbient)" />
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="url(#cyanBorder)" stroke-width="4" />
  
  <!-- Bold Electric Cyan Brand Monogram 'f0' -->
  <text x="64" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="74" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="-3">f0</text>
  
  <!-- Precision white-cyan accent dot -->
  <circle cx="100" cy="36" r="6" fill="#ffffff" />
</svg>
