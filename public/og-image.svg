<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#090a0f" />
  <rect width="1200" height="630" fill="url(#glow)" />
  
  <!-- Outer border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Tag -->
  <rect x="80" y="90" width="360" height="40" rx="20" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
  <text x="100" y="115" font-family="ui-monospace, monospace" font-size="14" fill="#00f0ff">creative studio &amp; deep-tech lab</text>
  
  <!-- Logo / Brand -->
  <text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="900" fill="#ffffff" letter-spacing="-3">
    <tspan fill="#00f0ff" font-family="ui-monospace, monospace">f0</tspan>undr
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500" fill="#9ca3af">
    Ads, Commercial Video, Custom Software, Apps, Games &amp; Autonomous AI
  </text>
  
  <!-- Deliverable badges -->
  <rect x="80" y="450" width="220" height="44" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <text x="190" y="478" font-family="ui-monospace, monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">video ads &amp; posters</text>
  
  <rect x="320" y="450" width="220" height="44" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <text x="430" y="478" font-family="ui-monospace, monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">autonomous ai agents</text>
  
  <rect x="560" y="450" width="220" height="44" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <text x="670" y="478" font-family="ui-monospace, monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">cross-platform apps</text>

  <rect x="800" y="450" width="220" height="44" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <text x="910" y="478" font-family="ui-monospace, monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">games &amp; simulation</text>
